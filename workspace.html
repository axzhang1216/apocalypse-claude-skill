      mesh.userData._prevTint = mesh.material.uniforms.uTint.value.clone();
      const t = mesh.material.uniforms.uTint.value;
      t.multiplyScalar(1.5);
    }
  } else if (mesh.material && 'emissiveIntensity' in mesh.material) {
    mesh.userData._prevEmissive = mesh.material.emissiveIntensity;
    mesh.material.emissiveIntensity = 1.2;
  }
}

function resetGlow(mesh) {
  if (mesh.userData.baseScale) {
    mesh.scale.set(mesh.userData.baseScale, mesh.userData.baseScale, 1);
    if (mesh.userData._prevTint) {
      mesh.material.uniforms.uTint.value.copy(mesh.userData._prevTint);
      delete mesh.userData._prevTint;
    }
  } else if (mesh.material && mesh.userData._prevEmissive !== undefined) {
    mesh.material.emissiveIntensity = mesh.userData._prevEmissive;
  }
}

function onClick(e) {
  // Suppress click-to-enter if the user just dragged — prevents accidentally
  // jumping into a project when releasing the mouse after a rotation.
  if (controls && controls._wasDrag) return;
  if (!hoveredMesh) return;
  const ud = hoveredMesh.userData;

  if (ud.type === 'project' && currentView === 'universe') {
    // Every project opens the 3D solar view; points (if any) appear as linked planets.
    const target = hoveredMesh.position.clone();
    animateCameraTo(target, () => buildSolarView(ud.proj));
  } else if (ud.type === 'session' && currentView === 'solar') {
    openPanel(ud.session, ud.sid);
  } else if (ud.type === 'point' && currentView === 'solar') {
    openGraphPanel(ud.point);
  }
}

function animateCameraTo(target, callback) {
  controls.enabled = false;
  const start = camera.position.clone();
  const end = target.clone().add(new THREE.Vector3(0, 5, 30));
  const startTarget = controls.target.clone();
  let t = 0;
  function step() {
    t += 0.04;
    if (t >= 1) {
      callback();
      controls.enabled = true;
      return;
    }
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    camera.position.lerpVectors(start, end, ease);
    controls.target.lerpVectors(startTarget, target, ease);
    controls.update();
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

backBtn.addEventListener('click', () => {
  entryAnimDone = true;
  currentProject = null;
  buildUniverseView();
  populateSidebar();  // Restore PROJECTS list mode
  // Camera will be set by adjustCameraForLayout in finishUniverseBuild
});

// ──── animate ──────────────────────────────────────────────────────────────
let clock, elapsed = 0;

function animate() {
  animFrame = requestAnimationFrame(animate);
  const dt = clock.getDelta();
  elapsed += dt;

  if (!prefersReducedMotion) {
    // Liveness breathing: alive projects gently pulse scale.
    // Skip the hovered mesh so the 1.3x hover-grow isn't overwritten
    // every frame (this is what was making hover inert on active central
    // nebulae).
    projectMeshes.forEach(mesh => {
      if (mesh === hoveredMesh) return;
      const ud = mesh.userData;
      if (ud.liveness === undefined || ud.liveness < 0.5) return; // Only alive
      if (ud._entryDone === false) return; // Skip during entry
      const breathe = Math.sin(elapsed * 0.6 + ud.phaseOffset) * 0.012;
      const s = ud.baseScale * (1 + breathe);
      mesh.scale.set(s, s, 1);
    });

    // Billboard + UV distortion + rotation for nebula planes
    projectMeshes.forEach(mesh => {
      if (!mesh.isMesh) return; // Skip non-plane meshes
      // Billboard: face camera
      mesh.quaternion.copy(camera.quaternion);
      // Slow rotation
      const ud = mesh.userData;
      if (ud.rotSpeed) mesh.rotation.z += ud.rotSpeed * dt;
      // Update UV distortion time
      if (mesh.material.uniforms && mesh.material.uniforms.uTime) {
        mesh.material.uniforms.uTime.value = elapsed;
      }
    });

    // Entry animation: nebulae scale up from small (first 0.8s)
    if (!entryAnimDone && entryStartTime > 0) {
      const t = Math.min((elapsed - entryStartTime) / 0.8, 1);
      projectMeshes.forEach(mesh => {
        const ud = mesh.userData;
        if (mesh === hoveredMesh) return; // Preserve hover scale during entry
        if (ud._entryDone) return;
        const dist = mesh.position.length();
        const maxDist = currentLayout ? currentLayout.bounds.radius || 100 : 100;
        const delay = (dist / maxDist) * 0.25;
        const localT = Math.max(0, Math.min(1, (elapsed - entryStartTime - delay) / 0.5));
        const ease = 1 - Math.pow(1 - localT, 3);
        const s = ud.baseScale * ease;
        mesh.scale.set(s, s, 1);
        if (localT >= 1) { mesh.scale.set(ud.baseScale, ud.baseScale, 1); ud._entryDone = true; }
      });
      if (t >= 1) entryAnimDone = true;
    }

    // Idle camera drift: subtle floating via spherical state (not direct position)
    if (currentView === 'universe' && !controls._dragging && controls.enabled) {
      const driftTheta = Math.sin(elapsed * 0.07) * 0.0003;
      const driftPhi = Math.cos(elapsed * 0.05) * 0.00015;
      controls._spherical.theta += driftTheta * dt * 60;
      controls._spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1,
        controls._spherical.phi + driftPhi * dt * 60));
      // Apply drift to camera
      const s = controls._spherical;
      camera.position.set(
        s.radius * Math.sin(s.phi) * Math.sin(s.theta),
        s.radius * Math.cos(s.phi),
        s.radius * Math.sin(s.phi) * Math.cos(s.theta)
      );
      camera.lookAt(controls.target);
    }

    // Background star flicker: activity-driven twinkling
    if (starFieldPoints && starFieldPoints.mesh && activeSessionCount > 0) {
      const colAttr = starFieldPoints.geo.getAttribute('color');
      const orig = starFieldPoints.originalCol;
      const intensity = Math.min(activeSessionCount / 10, 1); // 0-1 based on activity
      for (const i of starFieldPoints.flickerIndices) {
        const flickerSpeed = 0.5 + (i % 7) * 0.3; // Varied per star
        const flicker = Math.sin(elapsed * flickerSpeed + i) * 0.5 + 0.5; // 0-1
        const brightness = 0.3 + flicker * 0.7 * intensity;
        colAttr.array[i * 3]     = orig[i * 3]     * brightness;
        colAttr.array[i * 3 + 1] = orig[i * 3 + 1] * brightness;
        colAttr.array[i * 3 + 2] = orig[i * 3 + 2] * brightness;
      }
      colAttr.needsUpdate = true;
    }

    // Nova flash decay: fade out active flashes (iterate backwards to avoid splice index shift)
    for (let i = novaFlashes.length - 1; i >= 0; i--) {
      const flash = novaFlashes[i];
      flash.age += dt;
      const t = flash.age / flash.duration;
      if (t >= 1) {
        scene.remove(flash.sprite);
        flash.sprite.material.dispose();
        novaFlashes.splice(i, 1);
      } else {
        const ease = 1 - t;
        flash.sprite.material.opacity = ease;
        const s = flash.baseScale * (1 + t * 0.3);
        flash.sprite.scale.set(s, s, 1);
      }
    }
  }

  // Orbit planets
  planetOrbits.forEach(o => {
    o.angle += o.speed * dt;
    const sx = o.star.position.x;
    const sy = o.star.position.y;
    const sz = o.star.position.z;
    o.mesh.position.set(
      sx + Math.cos(o.angle) * o.radius,
      sy + Math.sin(o.angle * 0.3) * 0.5,
      sz + Math.sin(o.angle) * o.radius
    );
  });

  // Keep inter-galactic lanes attached to their galaxies + march the dashes
  // so they read as flowing lanes, not static "tool call" tickmarks.
  pointLinks.forEach(({ line, a, b, flowOffset }) => {
    const pos = line.geometry.attributes.position;
    pos.setXYZ(0, a.position.x, a.position.y, a.position.z);
    pos.setXYZ(1, b.position.x, b.position.y, b.position.z);
    pos.needsUpdate = true;
    // Animate lineDistance array to march the dashes (old three.js has no dashOffset uniform)
    const distAttr = line.geometry.attributes.lineDistance;
    if (!distAttr) return;
    const ud = distAttr.userData || (distAttr.userData = {});
    if (!ud.baseDist) {
      const dx = b.position.x - a.position.x;
      const dy = b.position.y - a.position.y;
      const dz = b.position.z - a.position.z;
      ud.baseDist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    }
    const period = (line.material.dashSize || 1) + (line.material.gapSize || 1);
    const phase = ((elapsed * 0.4 + (flowOffset || 0)) % 1) * period;
    distAttr.array[0] = -phase;
    distAttr.array[1] = ud.baseDist - phase;
    distAttr.needsUpdate = true;
  });

  controls.update();
  renderer.render(scene, camera);
}

// ──── Progress tracking ────────────────────────────────────────────────────
function updateLoadingProgress(current, total, status) {
  const loadingOverlay = document.getElementById('loading-overlay');
  const progress = Math.round((current / total) * 100);
  loadingOverlay.textContent = `${status} ${progress}%`;
}

// ──── bootstrap ────────────────────────────────────────────────────────────
async function main() {
  const loadingOverlay = document.getElementById('loading-overlay');
  const perfStats = document.getElementById('perf-stats');

  // Show loading indicator
  loadingOverlay.classList.add('visible');

  const startTime = performance.now();

  const mod = await import('/three.module.min.js');
  THREE = mod;

  // Minimal orbit controls (replaces OrbitControls)
  OrbitControls = class {
    constructor(cam, domEl) {
      this.camera = cam;
      this.target = new THREE.Vector3();
      this.enabled = true;
      this.enableDamping = false;
      this.dampingFactor = 0.08;
      this._spherical = { theta: 0, phi: Math.PI / 2, radius: 120 };
      this._dragging = false;
      this._last = { x: 0, y: 0 };
      const s = this._spherical;
      const updateCamera = () => {
        cam.position.set(
          s.radius * Math.sin(s.phi) * Math.sin(s.theta),
          s.radius * Math.cos(s.phi),
          s.radius * Math.sin(s.phi) * Math.cos(s.theta)
        );
        cam.lookAt(this.target);
      };
      // Sync spherical state from current camera position
      const syncFromCamera = () => {
        const dx = cam.position.x - this.target.x;
        const dy = cam.position.y - this.target.y;
        const dz = cam.position.z - this.target.z;
        s.radius = Math.sqrt(dx * dx + dy * dy + dz * dz);
        s.phi = Math.acos(Math.max(-1, Math.min(1, dy / s.radius)));
        s.theta = Math.atan2(dx, dz);
      };
      domEl.addEventListener('mousedown', e => {
        if (!this.enabled) return;
        syncFromCamera();
        this._dragging = true; this._last = { x: e.clientX, y: e.clientY };
        this._down = { x: e.clientX, y: e.clientY };
        this._wasDrag = false;
      });
      window.addEventListener('mouseup', () => {
        this._dragging = false;
        // Clear _wasDrag after the click event has had a chance to fire.
        setTimeout(() => { this._wasDrag = false; }, 0);
      });
      window.addEventListener('mousemove', e => {
        if (!this.enabled || !this._dragging) return;
        const dx = e.clientX - this._last.x, dy = e.clientY - this._last.y;
        s.theta -= dx * 0.005;
        s.phi = Math.max(0.1, Math.min(Math.PI - 0.1, s.phi + dy * 0.005));
        this._last = { x: e.clientX, y: e.clientY };
        // Mark as drag once cumulative movement from mousedown exceeds 5px,
        // so onClick can suppress the click-to-enter.
        if (this._down) {
          const tdx = e.clientX - this._down.x, tdy = e.clientY - this._down.y;
          if (tdx*tdx + tdy*tdy > 25) this._wasDrag = true;
        }
        updateCamera();
      });
      domEl.addEventListener('wheel', e => {
        if (!this.enabled) return;
        e.preventDefault();
        // Don't call syncFromCamera — camera drift corrupts spherical state
        // Just adjust radius directly from current spherical state
        s.radius = Math.max(30, Math.min(300, s.radius + e.deltaY * 0.05));
        updateCamera();
      }, { passive: false });
      this.update = () => {};
    }
  };

  initRenderer();
  makeScene();
  clock = new THREE.Clock();
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  renderer.domElement.addEventListener('click', onClick);
  animate();

  // Load textures in parallel (non-blocking)
  loadExternalTextures().catch(() => {}); // Silently fail if textures missing

  try {
    const resp = await fetch('/api/workspace');
    if (!resp.ok) throw new Error('fetch failed');
    const data = await resp.json();
    if (!data || !data.projects || !Object.keys(data.projects).length) {
      emptyMsg.style.display = 'block';
      loadingOverlay.classList.remove('visible');
      return;
    }
    wsData = data;

    // Merge projects with the same title
    const rawProjects = Object.values(data.projects);
    const mergeMap = {};
    for (const p of rawProjects) {
      const key = p.title || p.name;
      if (!mergeMap[key]) {
        mergeMap[key] = { ...p, _subKeys: [p.name], _totalSessions: Object.keys(p.analyzed_sessions || {}).length };
      } else {
        const m = mergeMap[key];
        m._subKeys.push(p.name);
        m._totalSessions += Object.keys(p.analyzed_sessions || {}).length;
        Object.assign(m.analyzed_sessions, p.analyzed_sessions || {});
        m.sessions = (m.sessions || []).concat(p.sessions || []);
        m.total_messages = (m.total_messages || 0) + (p.total_messages || 0);
        m.total_tool_calls = (m.total_tool_calls || 0) + (p.total_tool_calls || 0);
        if ((p.last_active || '') > (m.last_active || '')) m.last_active = p.last_active;
        // Merge points from sub-projects
        if (p.points && p.points.length) {
          m.points = (m.points || []).concat(p.points);
        }
        if (p.first_seen && (!m.first_seen || p.first_seen < m.first_seen)) m.first_seen = p.first_seen;
      }
    }
    data.projects = mergeMap;
    const projects = Object.values(mergeMap);
    console.log(`Generating ${projects.length} nebulae (merged from ${rawProjects.length} folders)...`);

    // Load nebula textures first, then build universe
    await loadNebulaTextures();
    entryStartTime = elapsed;
    buildUniverseView();
    updateActiveCount();
    populateSidebar();
    // Flash novae for recently active sessions (after entry animation starts)
    setTimeout(() => flashRecentSessions(), 900);

    // Check if workspace is stale (>7 days since last analysis)
    checkStaleness(data.last_analysis || data.last_full_init);

    // Show performance stats (delayed to allow batch processing)
    setTimeout(() => {
      const loadTime = performance.now() - startTime;
      perfStats.textContent = `Loaded in ${loadTime.toFixed(0)}ms • ${projects.length} nebulae`;
      perfStats.style.display = 'block';

      // Auto-hide stats after 3 seconds
      setTimeout(() => {
        perfStats.style.display = 'none';
      }, 3000);
    }, 100);

  } catch (err) {
    emptyMsg.style.display = 'block';
    emptyMsg.innerHTML = 'Could not load workspace data.<br><a href="/">← Dashboard</a>';
    console.error('Workspace load error:', err);
    loadingOverlay.classList.remove('visible');
  }
}

main();

// ── Workspace staleness check & update ──
function relativeTime(ts) {
  if (!ts) return '未知';
  const diff = (Date.now() - new Date(ts).getTime()) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return `${Math.floor(diff/60)} 分钟前`;
  if (diff < 86400) return `${Math.floor(diff/3600)} 小时前`;
  const days = Math.floor(diff/86400);
  if (days < 30) return `${days} 天前`;
  return `${Math.floor(days/30)} 月前`;
}

let graphCurrentNode = null;

function openGraphPanel(node) {
  graphCurrentNode = node;
  const panel = document.getElementById('graph-side-panel');
  document.getElementById('gp-discussion').textContent = node.topic;
  document.getElementById('gp-decision').textContent = node.decision;
  // Reset launch button state — previous click may have left it disabled.
  const launchBtn = document.getElementById('gp-launch-btn');
  launchBtn.disabled = false;
  launchBtn.textContent = '打开 Session';
  launchBtn.style.borderColor = 'var(--green)';
  launchBtn.style.color = 'var(--green)';
  const sessionLink = document.getElementById('gp-session-link');
  const sid = node.session_id;
  const shortId = sid ? sid.slice(0, 8) : '?';
  sessionLink.textContent = `session ${shortId}...`;
  sessionLink.onclick = () => {
    closeGraphPanel();
    const s = currentProject && currentProject.analyzed_sessions
      ? currentProject.analyzed_sessions[sid] : null;
    if (s) openPanel(s, sid);
    return false;
  };
  // Prefer pre-cut point.messages (set at workspace_init time) — instant.
  // Fall back to fetching the full session compact view only when missing.
  loadCompactConversation(sid, node.messages);
  panel.classList.add('open');
}

async function loadCompactConversation(sessionId, preCutMessages) {
  const convEl = document.getElementById('gp-conversation');
  if (!convEl) return;
  convEl.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:8px 0">加载对话记录...</div>';
  let msgs = preCutMessages;
  if (!msgs) {
    try {
      const resp = await fetch(`/api/sessions2/${sessionId}/compact`);
      if (!resp.ok) throw new Error('not found');
      msgs = await resp.json();
    } catch (err) {
      convEl.innerHTML = `<div style="color:var(--muted);font-size:12px;padding:8px 0">无法加载对话记录</div>`;
      return;
    }
  }
  if (!msgs.length) {
    convEl.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:8px 0">无对话记录</div>';
    return;
  }
  convEl.innerHTML = '';
  for (const m of msgs) {
    const div = document.createElement('div');
    div.style.cssText = 'margin-bottom:10px;';
    const roleColor = m.role === 'user' ? 'var(--green)' : 'var(--blue)';
    const roleName = m.role === 'user' ? '用户' : 'Claude';
    const text = m.summary || m.text;
    const isSummary = !!m.summary;
    div.innerHTML = `<div style="font-size:10px;color:${roleColor};text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px">${roleName}${isSummary ? ' (摘要)' : ''}</div>` +
      `<div style="font-size:12px;color:var(--text);line-height:1.5;white-space:pre-wrap;word-break:break-word">${escapeHTML(text)}</div>`;
    convEl.appendChild(div);
  }
}

function closeGraphPanel() {
  document.getElementById('graph-side-panel').classList.remove('open');
  graphCurrentNode = null;
}

async function launchGraphSession() {
  if (!graphCurrentNode || !graphCurrentNode.session_id) return;
  const btn = document.getElementById('gp-launch-btn');
  btn.disabled = true;
  btn.textContent = '打开中...';
  try {
    const resp = await fetch(`/api/sessions2/launch/${graphCurrentNode.session_id}`, { method: 'POST' });
    const data = await resp.json();
    if (data.ok) {
      btn.textContent = '已打开';
      btn.style.borderColor = 'var(--muted)';
      btn.style.color = 'var(--muted)';
      btn.disabled = false;  // Reset so the user can re-trigger after success.
    } else {
      btn.textContent = '失败: ' + (data.error || '');
      btn.disabled = false;
    }
  } catch (err) {
    btn.textContent = '失败';
    btn.disabled = false;
  }
}

function checkStaleness(lastAnalysis) {
  const banner = document.getElementById('stale-banner');
  const textEl = banner.querySelector('.banner-text');
  const btnEl = document.getElementById('update-btn');

  if (!lastAnalysis) {
    textEl.textContent = 'Workspace 尚未初始化。';
    btnEl.textContent = '初始化 Workspace';
    banner.classList.add('visible');
    return;
  }

  const rel = relativeTime(lastAnalysis);
  const daysSince = (Date.now() - new Date(lastAnalysis).getTime()) / (1000 * 60 * 60 * 24);

  if (daysSince > 7) {
    textEl.textContent = `数据更新于 ${rel}，已超过 7 天，可能缺少最近的 session。`;
    banner.classList.add('stale');
  } else {
    textEl.textContent = `数据更新于 ${rel}`;
    banner.classList.remove('stale');
  }
  banner.classList.add('visible');
}

async function startWorkspaceUpdate() {
  const btn = document.getElementById('update-btn');
  const body = document.getElementById('modal-body');
  const overlay = document.getElementById('modal-overlay');

  btn.disabled = true;
  btn.textContent = '更新中...';
  body.innerHTML = '<div class="modal-loading">分析新 session 中</div>';
  overlay.classList.add('visible');

  try {
    const resp = await fetch('/api/workspace/update', { method: 'POST' });
    const data = await resp.json();

    if (!data.ok) {
      body.innerHTML = `<div class="modal-line" style="color:var(--red)">更新失败: ${escapeHTML(data.error || 'unknown')}</div>`;
      return;
    }

    if (data.total_new === 0) {
      body.innerHTML = '<div class="modal-line">没有新的 session 需要分析。所有数据已是最新。</div>';
      document.getElementById('stale-banner').classList.remove('visible');
      return;
    }

    let html = `<div class="modal-line">分析完成：<strong style="color:var(--green)">${data.total_new}</strong> 个新 session，${data.projects_updated} 个项目有更新</div>`;

    for (const p of data.projects) {
      html += `<div class="modal-proj">${escapeHTML(p.title || p.name)}</div>`;
      for (const s of p.sessions) {
        const goal = escapeHTML(s.goal || '(无信息)');
        const cat = escapeHTML(s.category);
        html += `<div class="modal-sess">• <span class="goal">${goal}</span>  [${cat}]</div>`;
      }
    }

    html += '<div class="modal-done">✓ Workspace 已更新</div>';
    body.innerHTML = html;

    // Hide stale banner
    document.getElementById('stale-banner').classList.remove('visible');

    // Reload the page data after a short delay
    setTimeout(() => location.reload(), 2000);
  } catch (err) {
    body.innerHTML = `<div class="modal-line" style="color:var(--red)">请求失败: ${escapeHTML(err.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '更新 Workspace';
  }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('visible');
}
</script>
