name: Spatial OS checks

on:
  push:
    branches:
      - feat/spatial-os-integration
    paths:
      - 'skills_apocalypse/spatial_*'
      - 'skills_apocalypse/start.sh'
      - 'skills_apocalypse/install.sh'
      - 'skills_apocalypse/tests/test_spatial_server.py'
      - '.github/workflows/spatial-os-check.yml'
  pull_request:
    paths:
      - 'skills_apocalypse/spatial_*'
      - 'skills_apocalypse/start.sh'
      - 'skills_apocalypse/install.sh'
      - 'skills_apocalypse/tests/test_spatial_server.py'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m py_compile skills_apocalypse/spatial_server.py
      - name: Spatial bridge tests
        run: python -m unittest skills_apocalypse.tests.test_spatial_server
      - name: JavaScript syntax
        run: node --check skills_apocalypse/spatial_os.js
      - name: Shell syntax
        run: bash -n skills_apocalypse/start.sh skills_apocalypse/install.sh
