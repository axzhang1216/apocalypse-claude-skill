name: Windows desktop release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            if [[ "$COMMIT_MESSAGE" =~ (v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?) ]]; then
              version="${BASH_REMATCH[1]}"
            else
              echo "Could not find a semantic version in the release commit message." >&2
              exit 1
            fi
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app_version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "Preparing Apocalypse $version"

  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python_arch: x64
            pe_machine: '0x8664'
          - arch: x86
            python_arch: x86
            pe_machine: '0x014c'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.arch }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - name: Verify Python architecture
        shell: pwsh
        run: |
          python -c "import platform, struct; print(platform.python_version(), platform.machine(), struct.calcsize('P') * 8); assert struct.calcsize('P') * 8 == ${{ matrix.arch == 'x64' && '64' || '32' }}"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r skills_apocalypse/desktop-requirements.txt
          choco install innosetup -y --no-progress

      - name: Build Apocalypse.exe (${{ matrix.arch }})
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name Apocalypse `
            --collect-all webview `
            --hidden-import clr `
            --add-data "skills_apocalypse/spatial_os.html;." `
            --add-data "skills_apocalypse/spatial_os.css;." `
            --add-data "skills_apocalypse/spatial_os.js;." `
            --add-data "skills_apocalypse/dashboard.html;." `
            skills_apocalypse/desktop_app.py

      - name: Verify PE architecture
        shell: pwsh
        run: |
          $path = Resolve-Path 'dist/Apocalypse.exe'
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 1024) { throw 'Apocalypse.exe is unexpectedly small' }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Missing MZ PE header' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expected = [Convert]::ToUInt16('${{ matrix.pe_machine }}'.Substring(2), 16)
          Write-Host ('PE machine: 0x{0:X4}' -f $machine)
          if ($machine -ne $expected) {
            throw ('Wrong PE architecture. Expected 0x{0:X4}, got 0x{1:X4}' -f $expected, $machine)
          }
          $size = (Get-Item $path).Length
          if ($size -lt 1000000) { throw "Apocalypse.exe looks unexpectedly small: $size bytes" }

      - name: Build Inno Setup installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exePath = (Resolve-Path 'dist/Apocalypse.exe').Path
          $outputDir = Join-Path $PWD 'installer-dist'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          if ($env:BUILD_ARCH -eq 'x64') {
            $archDirectives = @'
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          '@
          } else {
            $archDirectives = @'
          ArchitecturesAllowed=x86compatible
          '@
          }

          $iss = @"
          [Setup]
          AppId={{4D4A62DD-586F-471A-8B99-6B18C0596501}
          AppName=Apocalypse
          AppVersion=$env:APP_VERSION
          AppPublisher=Aoxing Zhang
          AppPublisherURL=https://github.com/axzhang1216/apocalypse
          AppSupportURL=https://github.com/axzhang1216/apocalypse/issues
          AppUpdatesURL=https://github.com/axzhang1216/apocalypse/releases
          DefaultDirName={autopf}\Apocalypse
          DefaultGroupName=Apocalypse
          DisableProgramGroupPage=yes
          UninstallDisplayIcon={app}\Apocalypse.exe
          OutputDir=$outputDir
          OutputBaseFilename=Apocalypse-Setup-$env:BUILD_ARCH
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          CloseApplications=yes
          RestartApplications=no
          $archDirectives

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"; Flags: unchecked

          [Files]
          Source: "$exePath"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\Apocalypse"; Filename: "{app}\Apocalypse.exe"
          Name: "{autodesktop}\Apocalypse"; Filename: "{app}\Apocalypse.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\Apocalypse.exe"; Description: "Launch Apocalypse"; Flags: nowait postinstall skipifsilent
          "@

          $issPath = Join-Path $PWD "Apocalypse-$env:BUILD_ARCH.iss"
          Set-Content -Path $issPath -Value $iss -Encoding UTF8

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          $setup = Join-Path $outputDir "Apocalypse-Setup-$env:BUILD_ARCH.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not created: $setup" }
          Write-Host "Installer: $setup"
          Get-Item $setup | Format-List Name,Length,LastWriteTime

      - name: Smoke-test silent install
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path "installer-dist/Apocalypse-Setup-$env:BUILD_ARCH.exe").Path
          $target = Join-Path $env:RUNNER_TEMP "Apocalypse-$env:BUILD_ARCH-test"
          $proc = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Silent installer test failed: $($proc.ExitCode)" }
          $installed = Join-Path $target 'Apocalypse.exe'
          if (-not (Test-Path $installed)) { throw "Installed Apocalypse.exe not found at $installed" }
          Write-Host "Silent install smoke test passed: $installed"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Setup-${{ matrix.arch }}
          path: installer-dist/Apocalypse-Setup-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Apocalypse-Setup-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum Apocalypse-Setup-x64.exe Apocalypse-Setup-x86.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Apocalypse ${VERSION}

          Windows desktop release of Apocalypse Spatial OS.

          - **Apocalypse-Setup-x64.exe** — recommended for normal 64-bit Windows 10/11 systems.
          - **Apocalypse-Setup-x86.exe** — native 32-bit build for 32-bit Windows / x86 environments.
          - **SHA256SUMS.txt** — checksums for both installers.

          The application opens as a standalone Windows desktop window rather than a browser tab. It embeds the local Apocalypse server and uses Microsoft Edge WebView2 for the UI renderer.

          **Note:** these community-built installers are currently unsigned, so Windows SmartScreen may show a warning on first launch.
          EOF

      - name: Create GitHub Release and upload installers
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; uploading/replacing assets."
            gh release upload "$VERSION" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Apocalypse $VERSION" \
              --notes-file release-notes.md \
              --latest
          fi
