name: One-shot Spatial OS syntax fix

on:
  push:
    branches: [feat/spatial-os-integration]
    paths: ['.github/workflows/spatial-os-one-shot-fix.yml']

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spatial-os-integration
      - name: Apply exact syntax fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('skills_apocalypse/spatial_os.js')
          s = p.read_text(encoding='utf-8')
          old = '<div class="inspect-transcript" id="inspectTranscript"></div>`;else b.innerHTML='
          new = '<div class="inspect-transcript" id="inspectTranscript"></div>`;}else b.innerHTML='
          if old not in s:
              raise SystemExit('target syntax pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check skills_apocalypse/spatial_os.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills_apocalypse/spatial_os.js
          git commit -m 'fix: close decision inspector branch'
          git push origin HEAD:feat/spatial-os-integration
